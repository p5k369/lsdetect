[package]
name = "lsdetect"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Patrick Zwerschke"]
repository = "https://github.com/p5k369/lsdetect"
documentation = "https://docs.rs/lsdetect"
description = "Line segment detector (LSD) in pure Rust, with a fast perspective warp and Python bindings"
readme = "README.md"
keywords = ["lsd", "line-detection", "computer-vision", "image", "warp"]
categories = ["computer-vision", "multimedia::images", "algorithms"]
exclude = [
    "/.github",
    "/tests",
    "/pyproject.toml",
    "/lsdetect.pyi",
    "/.editorconfig",
    "/.pre-commit-config.yaml",
]

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
missing_docs = "warn"

[dependencies]
numpy = { version = "0.29.0", optional = true }
pyo3 = { version = "0.29.2", features = ["abi3-py311"], optional = true }
rayon = "1.12.0"

[features]
default = []
extension-module = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]
